<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | B.Voc Information Hub</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #2563eb);
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .signup-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .signup-button:hover {
            background: #1d4ed8;
        }

        .signup-button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
        }

        .login-link a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="auth-container">

    <div class="logo">
        🎓
    </div>

    <h1>
        Create Account
    </h1>

    <p class="subtitle">
        Join the B.Voc Information Hub
    </p>


    <form id="signup-form">


        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

        </div>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="6"
                required
            >

        </div>


        <div class="form-group">

            <label for="confirm-password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm-password"
                placeholder="Confirm your password"
                minlength="6"
                required
            >

        </div>


        <button
            type="submit"
            class="signup-button"
            id="signup-button"
        >
            Create Account
        </button>

    </form>


    <div id="message"></div>


    <div class="login-link">

        Already have an account?

        <a href="/login">
            Login
        </a>

    </div>


</div>



<script type="module">


    // =====================================================
    // FIREBASE IMPORTS
    // =====================================================

    import {
        initializeApp
    } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
        getAuth,
        createUserWithEmailAndPassword
    } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
    getFirestore,
    doc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



    // =====================================================
    // FIREBASE CONFIGURATION
    // =====================================================

    const firebaseConfig = {
  apiKey: "AIzaSyBCDKa_6V-J7TZW_3pi4K0G_3S7U5QETjg",
  authDomain: "bvoc-information-hub.firebaseapp.com",
  projectId: "bvoc-information-hub",
  storageBucket: "bvoc-information-hub.firebasestorage.app",
  messagingSenderId: "545656219765",
  appId: "1:545656219765:web:3688bef19ebb3db3fef03c",
  measurementId: "G-53PWHVHNBB"
};


    // =====================================================
    // INITIALIZE FIREBASE
    // =====================================================

   // =====================================================
// INITIALIZE FIREBASE
// =====================================================

const firebaseApp = initializeApp(firebaseConfig);

const auth = getAuth(firebaseApp);

const db = getFirestore(firebaseApp);



    // =====================================================
    // SIGNUP FORM
    // =====================================================

    const signupForm =
        document.getElementById("signup-form");


    const signupButton =
        document.getElementById("signup-button");


    const message =
        document.getElementById("message");



    // =====================================================
    // SIGNUP
    // =====================================================

    signupForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirm-password")
                    .value;



            // Check password match

            if (password !== confirmPassword) {

                message.textContent =
                    "Passwords do not match.";

                message.style.color =
                    "red";

                return;
            }



            // Disable button

            signupButton.disabled = true;

            signupButton.textContent =
                "Creating Account...";


            message.textContent =
                "";



            try {


                // Create Firebase account

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );
                    const user = userCredential.user;

await setDoc(doc(db, "users", user.uid), {
    uid: user.uid,
    name: name,
    email: email,
    role: "student",
    createdAt: new Date().toISOString()
});


                


                console.log(
                    "Firebase user created:",
                    user.uid
                );


                console.log(
                    "Name:",
                    name
                );


                // Success message

                message.textContent =
                    "Account created successfully!";

                message.style.color =
                    "green";


                signupButton.textContent =
                    "Account Created!";



                // Redirect to login

                setTimeout(
                    () => {

                        window.location.href =
                            "/login";

                    },
                    1500
                );


            }


            catch (error) {


                // Show complete error in browser console

                console.error(
                    "Firebase Signup Error:",
                    error
                );


                message.style.color =
                    "red";



                // Firebase error messages

                if (
                    error.code ===
                    "auth/email-already-in-use"
                ) {

                    message.textContent =
                        "This email is already registered.";

                }


                else if (
                    error.code ===
                    "auth/weak-password"
                ) {

                    message.textContent =
                        "Password must be at least 6 characters.";

                }


                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    message.textContent =
                        "Please enter a valid email.";

                }


                else if (
                    error.code ===
                    "auth/operation-not-allowed"
                ) {

                    message.textContent =
                        "Email/Password authentication is not enabled in Firebase.";

                }


                else if (
                    error.code ===
                    "auth/invalid-api-key"
                ) {

                    message.textContent =
                        "Firebase API key is incorrect.";

                }


                else {

                    message.textContent =
                        "Signup failed: " +
                        error.message;

                }


                // Enable button again

                signupButton.disabled =
                    false;

                signupButton.textContent =
                    "Create Account";

            }

        }
    );

</script>


</body>

</html>
