<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty | B.Voc Information Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 7%;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #111;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .header h2 {
            color: #b94742;
            margin: 0;
            font-size: 25px;
        }

        .back-link {
            color: #003b5c;
            text-decoration: none;
            font-size: 15px;
        }

        .faculty-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 210px));
            justify-content: center;
            gap: 16px 30px;
        }

        .faculty-card {
            text-align: center;
            background: #f8f8f8;
            border-top: 2px solid #b94742;
            border-bottom: 2px solid #b94742;
            border-radius: 11px;
            overflow: hidden;
            padding-bottom: 10px;
        }

        .faculty-card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            background: #eeeeee;
            border-bottom: 1px solid #ddd;
        }

        .faculty-info {
            padding: 12px 8px 5px;
        }

        .faculty-info h3 {
            font-size: 14px;
            margin: 5px 0 8px;
        }

        .faculty-info p {
            font-size: 14px;
            margin: 7px 0;
            overflow-wrap: anywhere;
        }

        .view-button {
            display: inline-block;
            width: 105px;
            margin-top: 12px;
            padding: 8px;
            border-radius: 8px;
            background: #b94742;
            color: white;
            text-decoration: none;
            font-size: 12px;
        }

        .view-button:hover {
            background: #963630;
        }

        @media (max-width: 750px) {
            .faculty-grid {
                grid-template-columns: repeat(2, minmax(0, 210px));
                gap: 18px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 18px;
            }

            .faculty-grid {
                grid-template-columns: minmax(0, 280px);
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h2>Faculty</h2>
        <a href="{{ url_for('home') }}" class="back-link">
            &laquo; Back
        </a>
    </div>

    <div class="faculty-grid">

        {% for member in faculty %}
        <div class="faculty-card">
            <img
                src="{{ url_for('static', filename=member.photo) }}"
                alt="{{ member.name }}"
            >

            <div class="faculty-info">
                <h3>{{ member.name }}</h3>
                <p>{{ member.designation }}</p>
                <p>{{ member.email }}</p>

                <a
                    href="{{ url_for('faculty_detail', faculty_id=member.id) }}"
                    class="view-button"
                >
                    View
                </a>
            </div>
        </div>
        {% endfor %}

    </div>
</body>
</html>
