<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>B.Voc Departments</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .departments-page {
            min-height: 100vh;
            padding: 120px 6% 70px;
            background:
                radial-gradient(circle at 10% 10%, rgba(0, 190, 255, 0.10), transparent 30%),
                radial-gradient(circle at 90% 30%, rgba(80, 80, 255, 0.10), transparent 30%),
                #020817;
            color: white;
        }

        .departments-header {
            max-width: 900px;
            margin: 0 auto 45px;
            text-align: center;
        }

        .departments-badge {
            display: inline-block;
            padding: 9px 18px;
            border: 1px solid rgba(80, 200, 255, 0.25);
            border-radius: 30px;
            color: #55dfff;
            background: rgba(20, 100, 140, 0.12);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .departments-header h1 {
            font-size: clamp(40px, 6vw, 70px);
            line-height: 1.05;
            margin: 0 0 18px;
            font-weight: 800;
        }

        .departments-header h1 span {
            background: linear-gradient(90deg, #22d3ee, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .departments-header p {
            color: #94a3b8;
            font-size: 17px;
            line-height: 1.7;
        }

        .department-search {
            max-width: 600px;
            margin: 0 auto 45px;
        }

        .department-search input {
            width: 100%;
            box-sizing: border-box;
            padding: 16px 20px;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: rgba(15, 23, 42, 0.85);
            color: white;
            outline: none;
            font-size: 16px;
        }

        .department-search input:focus {
            border-color: #22d3ee;
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.1);
        }

        .department-grid {
            max-width: 1250px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .department-card {
            overflow: hidden;
            border-radius: 22px;
            border: 1px solid rgba(148, 163, 184, 0.14);
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .department-card:hover {
            transform: translateY(-8px);
            border-color: rgba(34, 211, 238, 0.45);
        }

        .department-image {
            height: 210px;
            overflow: hidden;
            position: relative;
        }

        .department-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .department-card:hover .department-image img {
            transform: scale(1.05);
        }

        .department-code {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 7px 12px;
            border-radius: 20px;
            background: rgba(2, 8, 23, 0.8);
            color: #67e8f9;
            font-size: 12px;
            font-weight: 700;
        }

        .department-content {
            padding: 24px;
        }

        .department-content h2 {
            margin: 0 0 12px;
            font-size: 22px;
            line-height: 1.25;
        }

        .department-tagline {
            color: #67e8f9;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 13px;
        }

        .department-description {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .department-info {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .info-item {
            padding: 7px 11px;
            border-radius: 9px;
            background: rgba(51, 65, 85, 0.35);
            color: #cbd5e1;
            font-size: 12px;
        }
        .view-details {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 13px 16px;
    border-radius: 11px;
    text-align: center;
    text-decoration: none;

    background: linear-gradient(90deg, #0891b2, #2563eb);

    color: #ffffff !important;
    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.4;

    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.2s ease;
}

.view-details:hover {
    opacity: 0.9;
    transform: translateY(-2px);
}

        .view-details:hover {
            opacity: 0.88;
        }

        .no-results {
            display: none;
            text-align: center;
            color: #94a3b8;
            padding: 40px;
        }

        @media (max-width: 600px) {
            .departments-page {
                padding-left: 5%;
                padding-right: 5%;
            }

            .department-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- =====================================================
     DEPARTMENTS
===================================================== -->

<section id="departments"
         class="departments-section">

    <div class="section-label">
        EXPLORE
    </div>

    <h2>
        Explore Departments
    </h2>

    <p class="section-description">
        Explore specialized B.Voc programmes designed
        for today's industry requirements.
    </p>


    <div class="department-grid">

        {% for department in departments %}

        <div class="department-card">

            <!-- Department Image -->

            <img
                src="{% if department.bannerImage.startswith('/src/assets/') %}{{ url_for('static', filename='images/' + department.bannerImage.split('/')[-1]) }}{% else %}{{ department.bannerImage }}{% endif %}"
                alt="{{ department.name }}"
            >


            <div class="department-content">

                <!-- Code -->

                <div class="department-code">
                    {{ department.shortCode }}
                </div>


                <!-- Department Name -->

                <h3>
                    {{ department.name }}
                </h3>


                <!-- Tagline -->

                <p>
                    {{ department.tagline }}
                </p>


                <!-- Details Button -->

                <a href="/departments/{{ department.id }}">
                    View Department Details →
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

</section>


<script>

function searchDepartments() {

    const searchBox =
        document.getElementById("departmentSearch");

    const searchText =
        searchBox.value.toLowerCase().trim();

    const cards =
        document.querySelectorAll(".department-card");

    let visibleCards = 0;

    cards.forEach(card => {

        const name =
            card.dataset.name;

        if (name.includes(searchText)) {

            card.style.display = "block";
            visibleCards++;

        } else {

            card.style.display = "none";

        }

    });


    document.getElementById("noResults").style.display =
        visibleCards === 0 ? "block" : "none";
}

</script>

</body>
</html>
